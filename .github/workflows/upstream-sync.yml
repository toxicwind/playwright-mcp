name: Upstream Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_OWNER: microsoft
  UPSTREAM_REPO: playwright-mcp
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote remove upstream || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream "${{ env.UPSTREAM_BRANCH }}" --tags

      - name: Fast-forward if possible
        id: ff
        run: |
          branch="${{ github.event.repository.default_branch }}"
          git checkout "$branch"
          if git merge --ff-only "upstream/${{ env.UPSTREAM_BRANCH }}"; then
            echo "mode=ff" >> "$GITHUB_OUTPUT"
            git push origin "$branch"
            echo "Fast-forwarded successfully"
          else
            echo "mode=pr" >> "$GITHUB_OUTPUT"
            echo "Need PR - diverged from upstream"
          fi

      - name: Prepare sync branch
        id: prep
        if: steps.ff.outputs.mode == 'pr'
        run: |
          branch="${{ github.event.repository.default_branch }}"
          sync_branch="upstream-sync/${{ env.UPSTREAM_BRANCH }}-$(date +%Y%m%d%H%M%S)"
          git checkout -B "$sync_branch" "origin/$branch"
          if git merge --no-edit "upstream/${{ env.UPSTREAM_BRANCH }}"; then
            git push origin "$sync_branch"
            echo "SYNC_BRANCH=$sync_branch" >> "$GITHUB_ENV"
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "::notice::Upstream changes conflict with this fork's customizations; skipping automatic sync PR. Reconcile manually when ready."
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.ff.outputs.mode == 'pr' && steps.prep.outputs.merged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const head = process.env.SYNC_BRANCH;
            const base = '${{ github.event.repository.default_branch }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const upstreamFull = '${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}';
            
            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open',
              head: `${owner}:${head}`, base
            });
            
            if (existing.data.length) {
              core.notice(`PR already exists: #${existing.data[0].number}`);
              return;
            }
            
            const pr = await github.rest.pulls.create({
              owner, repo,
              title: `Sync upstream ${upstreamFull} into ${base}`,
              head,
              base,
              body: [
                'Automated upstream sync could not be fast-forwarded cleanly.',
                '',
                `Upstream: ${upstreamFull}`,
                `Base branch: ${base}`,
                '',
                'This PR was opened automatically by the upstream sync workflow.'
              ].join('\n')
            });
            core.notice(`Created PR #${pr.data.number}: ${pr.data.html_url}`);
